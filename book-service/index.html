<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063b78"><title>Book a Service | Homnaro</title><meta name="description" content="Request a home service in Bengaluru from Homnaro."><meta name="robots" content="noindex"><link rel="canonical" href="https://homnaro.in/book-service/"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><img src="/homnaro-logo.png" alt="Homnaro — Home care made easy."></a><a class="button primary" href="/">Back to home</a></header><main class="booking-page"><div><p class="eyebrow">BOOK A SERVICE</p><h1>Tell us what your home needs.</h1><p>Fill in the details below. Your request is prepared on your device so you can send it to Homnaro through WhatsApp. No information is stored by this website yet.</p><a class="phone-link" data-phone href="#">Prefer to call? Call Homnaro</a></div><form id="booking-form" novalidate><label>Customer Name<input name="name" autocomplete="name" required></label><label>Mobile Number<input name="mobile" type="tel" inputmode="tel" autocomplete="tel" pattern="[0-9+() -]{8,}" required></label><label>Email <small>(optional)</small><input name="email" type="email" autocomplete="email"></label><label>Service Required<select name="service" required><option value="">Select a service</option><option>Plumbing</option><option>Electrical</option><option>Painting</option><option>Civil Repairs</option><option>Home Maintenance</option><option>Home Cleaning</option></select></label><label>Specific Service / Problem<input name="problem" required placeholder="For example: leaking kitchen tap"></label><div class="form-row"><label>Location<input name="location" autocomplete="address-level2" required></label><label>Pincode<input name="pincode" inputmode="numeric" pattern="[0-9]{6}" required></label></div><div class="form-row"><label>Preferred Date<input name="date" type="date"></label><label>Preferred Time<input name="time" type="time"></label></div><label>Description of the issue<textarea name="description" rows="4" placeholder="Share anything that may help the professional understand the problem."></textarea></label><label>Photo upload <small>(optional — photos are not uploaded through this site yet)</small><input type="file" accept="image/*" disabled></label><button class="button primary" type="submit">Submit Request <span>→</span></button><p id="form-status" class="form-status" hidden aria-live="polite"></p></form></main><script src="/config.js"></script><script src="/booking.js"></script></body></html>
